# spor: send one JSON line per request to the spor backend over syslog (UDP, loopback).
# Install in nginx's http context so it sorts BEFORE any file that uses spor_json,
# e.g. /etc/nginx/conf.d/00-spor-log.conf.
#
# host is $server_name, not $host: a client can send any Host header, but only a matching
# server block sets $server_name (its first name). spor keeps only hosts in vars.SPOR.local.
# country is Cloudflare's CF-IPCountry; city, region, lat and lon are its CF-IPCity, CF-Region,
# CF-IPLatitude and CF-IPLongitude, sent only
# with the "Add visitor location headers" Managed Transform on. For hosts that aren't proxied they
# are empty and spor fills them from its geo file (spor geo update). ip is $remote_addr: behind
# Cloudflare, set real_ip_header CF-Connecting-IP with Cloudflare's ranges as set_real_ip_from, or
# it is Cloudflare's address. spor stores it only with vars.SPOR.recordIp; it always uses it for
# the network lookup and the daily visitor hash.
log_format spor_json escape=json '{"msec":"$msec","host":"$server_name","uri":"$request_uri","status":"$status","referer":"$http_referer","ua":"$http_user_agent","country":"$http_cf_ipcountry","origin":"$http_origin","method":"$request_method","ip":"$remote_addr","city":"$http_cf_ipcity","region":"$http_cf_region","lat":"$http_cf_iplatitude","lon":"$http_cf_iplongitude"}';

# Applies to every server block without an access_log of its own. A server block that sets
# access_log (to a file of its own, say) replaces this one, so add the same line there too.
access_log syslog:server=127.0.0.1:2651,tag=spor,nohostname spor_json;
