# The spor dashboard behind nginx, tailnet only. Replace stats.example.com with your
# dashboard host and point its DNS at the machine's Tailscale IP (DNS only, not proxied).
# The certificate comes from the http context, or add ssl_certificate lines here.
server {
    listen 443 ssl;
    server_name stats.example.com;

    # Tailscale addresses only. If nginx rewrites the client address (real_ip), it must trust
    # only your proxy's addresses, or a forged header could pass this check.
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny  all;

    location / {
        proxy_pass           http://127.0.0.1:2650;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_read_timeout   60s;
        client_max_body_size 64k;
    }
}
